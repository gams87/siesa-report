{% extends 'pdf/base_pdf.html' %}

{% block content %}
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 class="title">Control de Temperaturas en las Cámaras</h1>
        <h2 class="sub-title">{{ title }}</h2>
        <p>Reporte del {{ start_date }} al {{ end_date }}</p>
        <p class="summary-highlight">
            TOTAL DE REGISTROS: {{ total_regs }}{% for part in summary_parts %} | {{ part }}{% endfor %}
        </p>
    </div>

    {{ body|safe }}

{% endblock %}
